<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>Image Resizer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="card" id="drop-zone">
        <h2>1. Folder</h2>
        <div class="row">
          <button id="pick-folder" type="button">Choose folder…</button>
          <span id="folder-path" class="muted">or drop a folder onto this window</span>
        </div>
        <label class="check"><input type="checkbox" id="recursive" /> Include subfolders</label>
        <label class="check">Save subfolder results
          <select id="output-mode" disabled>
            <option value="each" selected>Each folder has its own resized</option>
            <option value="single">One resized in the selected folder</option>
          </select>
        </label>
        <p id="image-count" class="muted"></p>
        <p id="no-images" class="warn" hidden>No images found</p>
        <ul id="file-list" class="files"></ul>
      </section>

      <section class="card">
        <h2>2. Size</h2>
        <div class="row">
          <select id="preset-select" aria-label="Size preset"></select>
          <button id="manage-presets" type="button">Manage presets…</button>
        </div>
      </section>

      <section class="card">
        <h2>3. Output</h2>
        <div class="row">
          <label>Format
            <select id="format">
              <option value="jpeg" selected>JPEG</option>
              <option value="png">PNG</option>
              <option value="keep">Keep original</option>
            </select>
          </label>
          <label>Quality <span id="quality-value">90</span>
            <input type="range" id="quality" min="1" max="100" value="90" />
          </label>
        </div>
      </section>

      <section class="card">
        <h2>4. Run</h2>
        <div class="row">
          <button id="run" type="button" class="primary" disabled>Run</button>
          <button id="cancel" type="button" hidden>Cancel</button>
          <progress id="progress" value="0" max="1" hidden></progress>
        </div>
        <p id="summary" class="muted"></p>
        <ul id="results" class="files"></ul>
      </section>
    </main>

    <dialog id="presets-dialog">
      <h2>Manage presets</h2>
      <ul id="preset-list" class="presets"></ul>
      <form id="preset-form" novalidate>
        <h3 id="preset-form-title">New preset</h3>
        <label>Name <input id="preset-name" type="text" autocomplete="off" /></label>
        <p class="error" id="err-name"></p>
        <div class="row">
          <label>Width <input id="preset-width" type="text" inputmode="numeric" autocomplete="off" /></label>
          <label>Height <input id="preset-height" type="text" inputmode="numeric" autocomplete="off" /></label>
        </div>
        <p class="error" id="err-width"></p>
        <p class="error" id="err-height"></p>
        <div class="row">
          <button type="submit" class="primary" id="preset-save">Add</button>
          <button type="button" id="preset-reset" hidden>Cancel edit</button>
          <button type="button" id="presets-close">Close</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="renderer.js"></script>
  </body>
</html>
